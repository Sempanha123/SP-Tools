<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SP-Tools logo</title>
  <desc id="desc">Rounded dark square with a purple and cyan lightning ribbon symbol.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101321"/>
      <stop offset="1" stop-color="#050812"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A777FF"/>
      <stop offset="0.52" stop-color="#7357FF"/>
      <stop offset="1" stop-color="#3C7BFF"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58D8FF"/>
      <stop offset="0.58" stop-color="#24BFFF"/>
      <stop offset="1" stop-color="#27E0D0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="124" fill="url(#bg)"/>
  <path d="M309 111c20-16 50 7 38 31L288 254H187c-29 0-42-36-20-55l142-88Z"
        fill="url(#top)"/>
  <path d="M203 401c-20 16-50-7-38-31l59-112h101c29 0 42 36 20 55l-142 88Z"
        fill="url(#bottom)"/>
  <ellipse cx="210" cy="214" rx="76" ry="28" fill="#A77CFF" opacity=".18" filter="url(#soft)"/>
  <ellipse cx="305" cy="296" rx="76" ry="28" fill="#35D5EA" opacity=".18" filter="url(#soft)"/>
</svg>
